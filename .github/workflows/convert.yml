name: Auto Convert Surge Lists to Sing-box SRS

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请修改此处
    paths:
      - 'surge/**'  # 监听 surge 目录下的文件变动

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install sing-box CLI
        run: |
          VERSION=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          wget -O sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Run Conversion Script
        run: |
          python3 convert.py

      - name: Commit and push generated SRS files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sing-box binary rule sets (.srs)"
          file_pattern: "sing-box/*"

